# Render Blueprint (optional): use Dashboard instead if you prefer manual setup.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: poker-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: poker-tracker-db
          property: connectionString
databases:
  - name: poker-tracker-db
    databaseName: poker_tracker
    user: poker_tracker
